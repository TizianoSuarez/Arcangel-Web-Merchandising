<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcángel - Merchandising Oficial</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    
    <header>
        <h1>ARCÁNGEL - TIENDA OFICIAL</h1>
        <p>Flow Factory Merch</p>
    </header>

    <!-- Botones de Filtrado -->
    <nav class="filter-container">
        <button class="filter-btn active" id="btn-todos">Todos</button>
        <button class="filter-btn" id="btn-remeras">Remeras</button>
        <button class="filter-btn" id="btn-gorras">Gorras</button>
        <button class="filter-btn" id="btn-accesorios">Accesorios</button>
    </nav>

    <!-- Contenedor donde se renderizan los productos dinámicamente -->
    <main class="products-grid" id="contenedor-productos">
        <!-- Los productos se inyectan mediante JavaScript -->
    </main>

    
    <script src="JAVASCRIPT/app.js"></script>
</body>
</html>
